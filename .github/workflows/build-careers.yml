# Rebuilds careers-bls.js from the latest BLS and O*NET data.
# Runs on GitHub's servers (free for public repos). It never touches main:
# it commits the rebuilt file to the branch it ran on, for review in a pull request.
name: Build career data

on:
  workflow_dispatch:
  push:
    branches: [bls-top-100-careers]
    paths:
      - "tools/**"
      - "source-data/**"
      - ".github/workflows/build-careers.yml"

permissions:
  contents: write

concurrency:
  group: build-careers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download BLS and O*NET data
        run: bash tools/fetch-data.sh

      - name: Save a snapshot of the source data (career-data branch)
        # Keeps the exact files each build used, so results can be checked or rebuilt later.
        run: |
          set -e
          ls -la data/onet > /tmp/snap-list.txt
          mkdir -p /tmp/snap/onet /tmp/snap/oews
          # Everything except files too big for GitHub (100 MB limit).
          find data/onet -maxdepth 1 -type f -size -90M -exec cp {} /tmp/snap/onet/ \;
          cp /tmp/snap-list.txt /tmp/snap/onet/ALL-FILES.txt
          cp data/oews/* /tmp/snap/oews/ 2>/dev/null || true
          [ -f data/ep-occupation.xlsx ] && cp data/ep-occupation.xlsx /tmp/snap/ || true
          cd /tmp/snap
          git init -q -b career-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Source data snapshot $(cat onet/VERSION.txt) / OEWS $(cat oews/VERSION.txt 2>/dev/null || echo none)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" career-data

      - name: Build careers-bls.js
        id: build
        run: |
          if [ ! -f data/oews/VERSION.txt ]; then echo "::warning::Skipping build: no BLS wage file"; echo "built=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          cd tools && npm ci --no-audit --no-fund && cd ..
          node tools/build-careers.mjs
          echo "built=yes" >> "$GITHUB_OUTPUT"

      - name: Commit the rebuilt file
        if: steps.build.outputs.built == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add careers-bls.js tools/build-report.md
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rebuild careers-bls.js from latest BLS and O*NET data"
          git push
