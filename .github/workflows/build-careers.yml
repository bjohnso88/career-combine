# Rebuilds careers-bls.js from the latest BLS and O*NET data.
# Runs on GitHub's servers (free for public repos). It never changes main (the live app) directly:
#  - On main (monthly check, a run by hand, or a merge that changes the data or tools), a changed
#    result goes to a new data-refresh/<date> branch with a pull request to review and merge.
#  - On any other branch, the rebuilt file is committed to that branch, for its own pull request.
name: Build career data

on:
  workflow_dispatch:
  schedule:
    # 1st of each month, 9:07 am Central (14:07 UTC). Picks up new O*NET releases.
    - cron: "7 14 1 * *"
  push:
    branches: ["**"]
    paths:
      - "tools/**"
      - "source-data/**"
      - ".github/workflows/build-careers.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-careers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download BLS and O*NET data
        run: bash tools/fetch-data.sh

      - name: Save a snapshot of the source data (career-data branch)
        # Keeps the exact files each build used, so results can be checked or rebuilt later.
        run: |
          set -e
          ls -la data/onet > /tmp/snap-list.txt
          mkdir -p /tmp/snap/onet /tmp/snap/oews
          # Everything except files too big for GitHub (100 MB limit).
          find data/onet -maxdepth 1 -type f -size -90M -exec cp {} /tmp/snap/onet/ \;
          cp /tmp/snap-list.txt /tmp/snap/onet/ALL-FILES.txt
          cp data/oews/* /tmp/snap/oews/ 2>/dev/null || true
          [ -f data/ep-occupation.xlsx ] && cp data/ep-occupation.xlsx /tmp/snap/ || true
          cd /tmp/snap
          git init -q -b career-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Source data snapshot $(cat onet/VERSION.txt) / OEWS $(cat oews/VERSION.txt 2>/dev/null || echo none)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" career-data

      - name: Build careers-bls.js
        id: build
        run: |
          if [ ! -f data/oews/VERSION.txt ]; then echo "::warning::Skipping build: no BLS wage file"; echo "built=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          cd tools && npm ci --no-audit --no-fund && cd ..
          node tools/build-careers.mjs
          echo "built=yes" >> "$GITHUB_OUTPUT"

      - name: Commit the rebuilt file
        if: steps.build.outputs.built == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add careers-bls.js tools/build-report.md
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            git commit -m "Rebuild careers-bls.js from latest BLS and O*NET data"
            git push
            exit 0
          fi
          # On main: never push to the live app. Put the change on its own branch for review.
          branch="data-refresh/$(date +%Y-%m-%d)"
          git checkout -b "$branch"
          git commit -m "Rebuild careers-bls.js from latest BLS and O*NET data"
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Career data refresh $(date +%Y-%m-%d)" \
            --body "The monthly data check found new BLS or O*NET data and rebuilt careers-bls.js. See tools/build-report.md for what changed. Merging makes it live." \
          || echo "::warning::Pushed $branch but couldn't open a pull request. Open one from that branch on GitHub, or allow it under Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests'."
