<!doctype html>
<html lang="en">
<head>

<title>Career Combine</title>
<meta name="description" content="A free, private career assessment. Upload your resume, run the drills, and get a scouting report ranking 46 careers by how well they fit you.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* One narrow column, sticky progress header, one short section per screen; results read like a scouting report */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#14202b; --muted:#5a6b79; --line:#d5dde4;
  --accent:#c8102e; --accent-ink:#ffffff; --navy:#1d4e89; --navy-soft:#e3ecf6;
  --good:#2c7a4b; --warn:#a45f00; --chip:#f4f7f9;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d141a; --surface:#15202a; --ink:#e5ecf1; --muted:#95a6b3; --line:#27353f;
  --accent:#ff4d5e; --accent-ink:#1a0005; --navy:#86b5ec; --navy-soft:#1a2b3d;
  --good:#5cc28a; --warn:#e3a84d; --chip:#1b2833; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d141a; --surface:#15202a; --ink:#e5ecf1; --muted:#95a6b3; --line:#27353f;
  --accent:#ff4d5e; --accent-ink:#1a0005; --navy:#86b5ec; --navy-soft:#1a2b3d;
  --good:#5cc28a; --warn:#e3a84d; --chip:#1b2833; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-inner{max-width:780px;margin:0 auto;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.brand h1 span{color:var(--accent)}
.brand-l{display:flex;flex-direction:column;gap:3px}
.madeby{font:500 .72rem var(--f-mono);letter-spacing:.04em;color:var(--muted);text-decoration:none}
.madeby:hover{color:var(--navy);text-decoration:underline}
.brand-r{display:flex;align-items:center;gap:10px}
.meta{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.themebtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:14px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chips button{flex:0 0 auto;font:500 .78rem var(--f-body);border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.chips button.cur{background:var(--navy);color:var(--surface);border-color:var(--navy)}
.chips button.full::after{content:" ✓";color:var(--good)}
.chips button.cur.full::after{color:inherit}
h2.sec{font-family:var(--f-display);font-size:2.1rem;line-height:1.05;margin:28px 0 4px;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.kicker{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-top:24px}
.lede{color:var(--muted);margin:6px 0 18px;max-width:62ch}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.q.ans{border-left:4px solid var(--good)}
.q .qt{font-weight:600;margin:0 0 10px;max-width:65ch}
.q .qn{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-bottom:4px}
.lik{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.opt{font:500 .85rem var(--f-body);border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:9px 6px;cursor:pointer;text-align:center;min-width:0}
.opt:hover{border-color:var(--navy)}
.opt.on{background:var(--navy);border-color:var(--navy);color:var(--surface)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.drop:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sub{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.sub:first-of-type{margin-top:0}
.pairs{display:grid;gap:4px;margin:6px 0 0;padding-left:18px}
.stack{display:flex;flex-direction:column;gap:8px}
.stack .opt{text-align:left;padding:11px 12px}
details.note{margin-top:10px}
details.note summary{cursor:pointer;font:500 .85rem var(--f-body);color:var(--navy);list-style:none;display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--navy);border-radius:999px;padding:5px 12px;background:var(--navy-soft)}
details.note summary::-webkit-details-marker{display:none}
details.note summary:hover,details.note[open] summary{border-style:solid}
details.note textarea{min-height:64px;margin-top:6px;font-size:.92rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.vs .or{align-self:center;font-family:var(--f-display);font-weight:700;color:var(--muted)}
.vs .opt{padding:14px 10px}
.sl{display:flex;flex-direction:column;gap:6px}
.sl input[type=range]{width:100%;accent-color:var(--accent)}
.sl .ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);gap:8px}
.sl .val{font-family:var(--f-mono);font-size:1.1rem;color:var(--navy);font-variant-numeric:tabular-nums}
.sl .val.unset{color:var(--muted)}
textarea,input[type=text],select{width:100%;font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:90px;resize:vertical}
label.f{display:block;font-weight:600;margin:14px 0 6px}
.rank{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.rank li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.rank .pos{font-family:var(--f-mono);color:var(--accent);font-weight:500}
.rank .mv{display:flex;gap:4px}
.rank .mv button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;width:34px;height:30px;cursor:pointer}
.small{font-size:.82rem;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{font:600 .95rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:11px 18px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:.85rem}
.skipline{font-size:.85rem;color:var(--muted);margin-top:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}
.intro-list{display:grid;gap:8px;padding:0;margin:12px 0;list-style:none}
.intro-list li{display:grid;grid-template-columns:auto 1fr;gap:10px}
.intro-list b{font-family:var(--f-mono);font-weight:500;color:var(--accent);min-width:3ch}
/* resume */
.drop{border:2px dashed var(--line);border-radius:10px;padding:20px;text-align:center;background:var(--chip);cursor:pointer}
.drop.over,.drop:hover{border-color:var(--navy)}
.drop strong{display:block}
.status{margin-top:8px;font-size:.9rem;min-height:1.3em}
.status.ok{color:var(--good)}.status.err{color:var(--warn)}
.skchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.skchip{font:500 .82rem var(--f-body);border:1px solid var(--navy);background:var(--navy-soft);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
.skchip::before{content:"✓ ";color:var(--good);font-weight:700}
.skchip.off{border-color:var(--line);background:var(--chip);text-decoration:line-through;opacity:.6}
.skchip.off::before{content:""}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1}
/* live matches bar */
.live{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(20,32,43,.08);padding-bottom:env(safe-area-inset-bottom,0px)}
.live-in{max-width:780px;margin:0 auto;padding:10px 16px}
.live-row{display:flex;align-items:center;gap:10px;min-height:36px}
.live-lab{font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.live-top{display:flex;gap:6px;flex:1;min-width:0;overflow:hidden}
.lm{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:.85rem;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 10px;min-width:0}
.lm b{font-family:var(--f-mono);font-weight:500;color:var(--navy)}
.lm .nm{overflow:hidden;text-overflow:ellipsis}
.mv{font:500 .72rem var(--f-mono)}
.mv.up{color:var(--good)}.mv.dn{color:var(--warn)}
.lm.flash{animation:flash 1.2s ease}
@keyframes flash{0%{border-color:var(--good);background:var(--navy-soft)}100%{}}
.live-tog{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;font:600 .8rem var(--f-body);cursor:pointer;white-space:nowrap}
.live-list{list-style:none;margin:8px 0 2px;padding:0;display:grid;gap:4px}
.live-list li{display:grid;grid-template-columns:1.6em 1fr auto auto;gap:8px;align-items:center;font-size:.9rem;padding:4px 0;border-top:1px solid var(--line)}
.live-list .n{font-family:var(--f-mono);color:var(--muted)}
.live-list .f{font-family:var(--f-mono);color:var(--navy)}
.live-note{font-size:.8rem;color:var(--muted);margin:6px 0 0}
.live-bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.live-bar i{display:block;height:100%;background:var(--accent)}
body.has-live{padding-bottom:84px}
body.has-live.live-open{padding-bottom:240px}
@media (max-width:600px){.live-top .lm:nth-child(n+2){display:none}}
@media (prefers-reduced-motion:reduce){.lm.flash{animation:none}}
@media print{.live{display:none!important}}
/* results */
.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.top3 .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.top3 .card .rk{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.top3 .card .nm{font-family:var(--f-display);font-size:1.35rem;line-height:1.1;margin:4px 0;font-weight:700}
.top3 .card .pc{font-family:var(--f-display);font-size:2.4rem;color:var(--accent);line-height:1}
.res{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.res summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:2.2em 1fr auto;gap:10px;align-items:center}
.res summary::-webkit-details-marker{display:none}
.res .no{font-family:var(--f-mono);color:var(--muted)}
.res .nm{font-weight:600;min-width:0}
.res .nm small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.res .fit{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.05rem;color:var(--navy)}
.res .fitbar{grid-column:2/4;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.res .fitbar i{display:block;height:100%;background:var(--navy)}
.res .body{padding:0 16px 16px;display:grid;gap:10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px 14px;font-size:.85rem}
.bls{border-top:1px dashed var(--line);padding-top:8px;font-size:.85rem}
.bls .src{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bls a{color:inherit}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
.desc{color:var(--muted);font-size:.9rem;margin:0}
input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.facts div span{display:block;font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.why{margin:4px 0 0;padding-left:20px}
.why li{margin:2px 0}
.tag{display:inline-block;font:500 .72rem var(--f-mono);padding:2px 7px;border-radius:999px;border:1px solid var(--line);margin-left:6px;vertical-align:middle;color:var(--muted)}
.tag.ind{color:var(--accent);border-color:var(--accent)}
.flag{color:var(--warn);font-weight:600}
.good{color:var(--good);font-weight:600}
.meter{display:grid;grid-template-columns:minmax(110px,180px) 1fr 3.2em;gap:10px;align-items:center;margin:6px 0;font-size:.9rem}
.meter .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.meter .tr i{display:block;height:100%;background:var(--navy)}
.meter .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.meter.na{opacity:.55}
.meter .lab small{display:block;color:var(--muted);font-size:.75rem;line-height:1.2}
.code{font-family:var(--f-display);font-size:2.6rem;letter-spacing:.12em;color:var(--accent);line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}
pre.sum{white-space:pre-wrap;word-break:break-word;font:400 .78rem/1.45 var(--f-mono);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:340px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:9}
.warnbox{border:1px solid var(--warn);background:var(--chip);border-radius:10px;padding:12px 14px;margin:12px 0}
details.method summary{cursor:pointer;font-weight:600}
footer{border-top:1px solid var(--line);padding:18px 16px 36px;text-align:center;font-size:.85rem;color:var(--muted)}
footer a{color:var(--navy)}
@media (max-width:600px){
  .lik{grid-template-columns:1fr}
  .lik .opt{text-align:left;padding:10px 12px}
  .top3,.grid2,.vs,.row2{grid-template-columns:1fr}
  .vs .or{justify-self:center}
  h2.sec{font-size:1.8rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{header.top,.nav,footer,.noprint,details.note{display:none!important}.res,.panel{break-inside:avoid}}
</style>

<script>
"use strict";
/* ============================================================
   DIMENSIONS (all 0–1; for the person = preference/tolerance, for a career = demand)
   c coding · tr travel · s selling · cu people/customers · l leading people · au independence
   v variety · p pressure · da data · th hands-on/physical · rp commission pay · h long hours
   o on-site/field · w writing · pr presenting · en building your own thing · pu purpose/helping
   Person-only: pay (pay priority) · pat (patience for a longer path)
   ============================================================ */
const ENJOY=["Hate it","Dislike","Not sure","Like","Love it"];
const AGREE=["Very inaccurate","Inaccurate","Neutral","Accurate","Very accurate"];
const ABIL=["Can't do it","Shaky","Can do OK","Comfortable","Easily"];

/* Holland RIASEC work activities, written in the style of the O*NET Interest Profiler */
const RI=[
 ["ri1","Install and set up equipment or machines","R"],
 ["ri2","Figure out why a problem keeps happening when nobody else can","I"],
 ["ri3","Design how something looks (a logo, a page, a space)","A"],
 ["ri4","Teach a group how to do something new","S"],
 ["ri5","Pitch an idea to a skeptical boss and win them over","E"],
 ["ri6","Keep records or files clean, organized, and accurate","C"],
 ["ri7","Repair equipment, vehicles, or devices when they break","R"],
 ["ri8","Dig into numbers or records to explain what changed","I"],
 ["ri9","Write something original: a story, article, or marketing copy","A"],
 ["ri10","Coach someone until they're confident on their own","S"],
 ["ri11","Negotiate a price or a contract","E"],
 ["ri12","Build a step-by-step process everyone has to follow","C"],
 ["ri13","Build or assemble things with your hands","R"],
 ["ri14","Use data or statistics to predict how something will turn out","I"],
 ["ri15","Shoot or edit photos or video","A"],
 ["ri16","Calm down a frustrated {cust} and solve their problem","S"],
 ["ri17","Lead a team to hit a goal by a deadline","E"],
 ["ri18","Track a project's budget, dates, and tasks","C"],
 ["ri19","Work outdoors or on a job site instead of at a desk","R"],
 ["ri20","Research a complicated topic in depth","I"],
 ["ri21","Come up with a brand, campaign, or creative concept","A"],
 ["ri22","Care for someone who is sick, hurt, or struggling","S"],
 ["ri23","Sell a product or service and earn commission on it","E"],
 ["ri24","Check documents for errors and rule-breaking","C"],
 ["ri25","Operate tools, vehicles, or specialized equipment","R"],
 ["ri26","Test which of two approaches works better","I"],
 ["ri27","Perform, present creatively, or entertain an audience","A"],
 ["ri28","Help a community or group that needs support","S"],
 ["ri29","Start your own business or side hustle","E"],
 ["ri30","Manage schedules, files, and paperwork for a team","C"]
];
function itemText(it){return it.text}
/* Big Five: public-domain IPIP items (Goldberg's 50-item Big-Five factor markers). k=+1 keyed, -1 reverse keyed */
const B5=[
 ["b1","Am the life of the party.","E",1],["b2","Get stressed out easily.","N",1],["b3","Am always prepared.","C",1],
 ["b4","Am interested in people.","A",1],["b5","Have a vivid imagination.","O",1],["b6","Don't talk a lot.","E",-1],
 ["b7","Am relaxed most of the time.","N",-1],["b8","Leave my belongings around.","C",-1],["b9","Feel little concern for others.","A",-1],
 ["b10","Am not interested in abstract ideas.","O",-1],["b11","Feel comfortable around people.","E",1],["b12","Worry about things.","N",1],
 ["b13","Pay attention to details.","C",1],["b14","Sympathize with others' feelings.","A",1],["b15","Have excellent ideas.","O",1],
 ["b16","Keep in the background.","E",-1],["b17","Seldom feel blue.","N",-1],["b18","Make a mess of things.","C",-1],
 ["b19","Am not really interested in others.","A",-1],["b20","Do not have a good imagination.","O",-1],["b21","Start conversations.","E",1],
 ["b22","Get upset easily.","N",1],["b23","Get chores done right away.","C",1],["b24","Make people feel at ease.","A",1],
 ["b25","Am quick to understand things.","O",1],["b26","Am quiet around strangers.","E",-1],["b27","Get irritated easily.","N",1],
 ["b28","Shirk my duties.","C",-1],["b29","Insult people.","A",-1],["b30","Have difficulty understanding abstract ideas.","O",-1]
];
const lik=(arr,scale)=>arr.map(([id,text,x,k])=>scale==="enjoy"?{t:"lik",id,text,scale,ri:x}:{t:"lik",id,text,scale,b5:x,k});

const VALUES=[
 ["pay","Pay and financial security"],["ach","Achievement — seeing results from my work"],
 ["ind","Independence — doing things my way"],["rec","Recognition — status, title, being known"],
 ["rel","Relationships — a team I like working with"],["sup","Support — a good boss and a stable company"],
 ["var","Variety and adventure — new places, new problems"],["pur","Purpose — helping people or making a difference"]
];

const SCHOOL=["None","A few online courses","A certification (a few months)","A 1–2 year program","A 4-year degree or more"];

const FQ_ITEMS={};
for(const [f,o] of Object.entries(FIELDQ))FQ_ITEMS[f]=o.qs.map(([id,text,opts])=>({t:"mc",id,text,opts,fq:f}));
function fieldItems(){return FQ_ITEMS[curField()]||[]}
function fieldDirs(){
  const f=curField(), F=FIELDQ[f]; if(!F)return null;
  const pts={}, why={}; let n=0;
  for(const it of FQ_ITEMS[f]){const v=state.answers[it.id]; if(v==null)continue; n++;
    const o=it.opts[v]; for(const [d,w] of Object.entries(o[2])){pts[d]=(pts[d]||0)+w; if(w>=1)(why[d]=why[d]||[]).push(o[0])}}
  if(!n)return null;
  const max=Math.max(...Object.values(pts),1);
  return Object.keys(F.dirs).map(k=>({k,name:F.dirs[k][0],blurb:F.dirs[k][1],roles:F.dirs[k][2],score:(pts[k]||0)/max,why:why[k]||[]})).sort((a,b)=>b.score-a.score);
}

function compute(){
  const A=state.answers, ev={};
  const add=(k,v,w=1)=>{(ev[k]=ev[k]||[]).push([clamp(v),w])};
  const addObj=o=>{if(o)for(const k in o)add(k,o[k],1)};
  const ri={R:[],I:[],A:[],S:[],E:[],C:[]}, b5={O:[],C:[],E:[],A:[],N:[]}, ab={R:[],I:[],A:[],S:[],E:[],C:[]}, gaps=[];
  let answered=0;
  for(const it of allItems()){
    const val=A[it.id];
    if(it.t==="lik"&&it.ri){
      const e=A[it.id], s=A[it.id+"_ab"];
      if(e!=null)ri[it.ri].push((e-1)/4);
      if(s!=null)ab[it.ri].push((s-1)/4);
      if(e!=null&&s!=null){answered++;gaps.push({text:T(itemText(it)),ri:it.ri,e,s})}

  // being filled in with a middle value, so nothing is presumed.

  for(const k in ri)R[k]=mean(ri[k]);
  const abN=Object.values(ab).reduce((s,a)=>s+a.length,0);
  for(const k in ab)AB[k]=mean(ab[k]);
  const b5N=Object.values(b5).reduce((s,a)=>s+a.length,0);

  feed("cu",B.E,.6);feed("pr",B.E,.6);feed("s",B.E,.4);feed("l",B.E,.3);feed("p",B.N==null?null:1-B.N,.7);feed("v",B.O,.5);feed("au",B.O,.3);feed("pu",B.A,.3);

    const sc=k=>{const i=order.indexOf(k);return i<0?.5:(order.length-1-i)/(order.length-1)};
    add("pay",sc("pay"),3);add("au",sc("ind"),1.5);add("l",sc("ach"),.5);add("p",sc("ach"),.4);
    add("pr",sc("rec"),.5);add("l",sc("rec"),.5);add("cu",sc("rel"),.6);add("rp",1-sc("sup"),.6);

    let s=0,w=0; for(const [v,ww] of e){s+=v*ww;w+=ww} D[k]=s/w;

function riVec(code){const v={R:0,I:0,A:0,S:0,E:0,C:0};[3,2,1].forEach((w,i)=>{if(code[i])v[code[i]]=w});return v}
function cosineCentered(a,b){
  const ks=Object.keys(a),ma=mean(ks.map(k=>a[k])),mb=mean(ks.map(k=>b[k]));

function industryMatch(car){

  const words=t.split(/[^a-z]+/).filter(w=>w.length>=3);
  return words.some(w=>car.ind.split(" ").some(x=>x.startsWith(w)||w.startsWith(x)));

function scoreCareer(car,P){
  const U=P.D;
  // Interest match needs a few interest answers; areas not rated yet sit at the average of the ones that were.
  let interest=null;
  if(P.riN>=6){const vals=Object.values(P.R).filter(v=>v!=null), avg=mean(vals), Rf={};for(const k in P.R)Rf[k]=P.R[k]??avg;interest=(cosineCentered(Rf,riVec(car.r))+1)/2}
  let pen=0,wsum=0; const parts=[];
  const spec=Object.assign({},SPEC,{en:[.3+.9*(car.d.en||0),1,1]});
  for(const k in spec){
    if(P.skip.has(k))continue;
    const [w,ov,un]=spec[k], cd=car.d[k]||0, ud=U[k], diff=cd-ud;
    const p=w*(diff>0?diff*ov:-diff*un);
    pen+=p; wsum+=w; parts.push({k,cd,ud,p,w,diff});
  }
  const dimSim=wsum?1-pen/wsum:null;
  // Pay only counts once you've told us your numbers.
  let payFit=null;
  if(P.minSet||P.targetSet){const a=P.minSet?Math.min(1,car.pay[0]/P.minPay):null, b=P.targetSet?Math.min(1,car.pay[1]/P.target):null;
    payFit=clamp(a!=null&&b!=null?.4*a+.6*b:(a??b))}
  const mid=car.pay[1];
  let ability=null; if(P.abN>=6){const vals=Object.values(P.AB).filter(v=>v!=null),avg=mean(vals),Af={};for(const k in P.AB)Af[k]=P.AB[k]??avg;ability=(cosineCentered(Af,riVec(car.r))+1)/2}
  const hit=car.sk.filter(s=>P.skills.has(s)), hasSk=P.skills.size>=3;
  // Careers with no listed core skills (some generated ones) get no resume score rather than 0/0.
  const skillFit=hasSk&&car.sk.length?clamp(hit.length/Math.min(3,car.sk.length)):null;
  // Blend only the parts we have evidence for. Work style counts more as more traits get answered.
  const comp=[[interest,.33],[ability,.12],[skillFit,.1],[dimSim,.55*Math.min(1,P.nDims/8)],[payFit,.1+.25*U.pay]].filter(([v,w])=>v!=null&&w>0);
  const cw=comp.reduce((a,[,w])=>a+w,0);
  let total=cw?comp.reduce((a,[v,w])=>a+v*w,0)/cw:.5;
  const flags=[];
  if(car.d.c>=.55&&U.c<=.35){total-=.08;flags.push("Needs regular coding, more than you said you want")}
  if(car.d.s>=.7&&U.s<=.3){total-=.08;flags.push("Heavy selling, which you said you'd rather avoid")}
  if(car.d.rp>=.6&&U.rp<=.25){total-=.06;flags.push("A big chunk of pay is commission")}
  if(car.d.tr>=.6&&U.tr<=.2){total-=.06;flags.push("Lots of travel, more than you want")}
  if(car.d.tr<=.15&&U.tr>=.7){total-=.03;flags.push("Almost no travel, and you want a lot")}
  if(car.d.h>=.8&&U.h<=.3){total-=.05;flags.push("Long hours are common")}
  if(P.minSet&&car.pay[0]<P.minPay-10){total-=.04;flags.push("Typical starting pay ($"+car.pay[0]+"k) is under your minimum ($"+P.minPay+"k)")}
  if(car.ease==="Hard"&&U.pat<.35){total-=.03;flags.push("Hard to break into; expect a multi-year path")}
  if(P.allowEdu!=null&&car.edu>P.allowEdu){total-=.05*(car.edu-P.allowEdu);flags.push("Usually needs "+EDU_NEED[car.edu]+", more school than you said you'd take on")}
  // BLS says some jobs (most managers, for example) are usually reached after years in a related job.
  const yrs=parseFloat(state.profile.years), exp=car.bls&&car.bls.exp;
  if(exp&&!isNaN(yrs)){
    if(/5 years or more/i.test(exp)&&yrs<5){total-=.07;flags.push("Usually needs 5+ years in a related job first, so it's a later step rather than a starting point")}
    else if(/less than 5/i.test(exp)&&yrs<1){total-=.03;flags.push("Usually needs some experience in a related job first")}
  }
  const ind=industryMatch(car); if(ind)total+=.02;

  const fb=clamp(1.6*(P.boost[car.id]||0),-.2,.15); total+=fb;

    .map(x=>"You want "+DIMS[x.k]+", and this role is heavy on it.");
  const lows=parts.filter(x=>["c","s","rp","h","tr"].includes(x.k)&&x.cd<=.25&&x.ud<=.3).slice(0,1)
    .map(x=>"Light on "+DIMS[x.k]+", which suits you.");
  const top2=P.riN>=6?Object.entries(P.R).filter(e=>e[1]!=null).sort((a,b)=>b[1]-a[1]).slice(0,2).map(e=>e[0]):[];
  const ints=top2.includes(car.r[0])?["Matches your strongest interest area: "+RNAME[car.r[0]]+" ("+RDESC[car.r[0]]+")."]:[];
  const topAb=(Object.entries(P.AB).filter(e=>e[1]!=null).sort((a,b)=>b[1]-a[1])[0]||[null])[0];
  const abr=ability!=null&&topAb&&car.r[0]===topAb&&P.AB[topAb]>=.6?["Plays to what you're already good at: "+RNAME[topAb].toLowerCase()+" work, so it should be quicker to break in."]:[];

    .map(x=>x.diff>0?"Asks for more "+DIMS[x.k]+" than you want.":"Less "+DIMS[x.k]+" than you'd like.");

}

const PDFJS='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
const PDFJS_WORKER='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
const MAMMOTH='https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js';
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("Couldn't load the file reader. Check your connection, or paste the text instead."));document.head.appendChild(s)})}
async function readFile(file){
  const n=file.name.toLowerCase();
  if(n.endsWith(".pdf")){
    if(!window.pdfjsLib)await loadScript(PDFJS);
    window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
    const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    let out="";
    for(let i=1;i<=pdf.numPages;i++){const tc=await (await pdf.getPage(i)).getTextContent();out+=tc.items.map(it=>it.str+(it.hasEOL?"\n":" ")).join("")+"\n"}
    return out;
  }
  if(n.endsWith(".docx")){if(!window.mammoth)await loadScript(MAMMOTH);return (await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()})).value}
  if(/\.(txt|md)$/.test(n))return await file.text();
  throw new Error("That file type isn't supported. Use PDF, DOCX, or TXT, or paste the text.");
}
function estimateYears(text){
  const yr=new Date().getFullYear(), rx=/\b((?:19|20)\d{2})\s*(?:-|–|—|to)\s*((?:19|20)\d{2}|present|current|now)\b/gi, spans=[];let m;
  while((m=rx.exec(text))){const a=+m[1],b=/\d/.test(m[2])?+m[2]:yr;if(b>=a&&a<=yr)spans.push([a,Math.max(b,a+.5)])}
  spans.sort((x,y)=>x[0]-y[0]);let total=0,cur=null;
  for(const s of spans){if(!cur||s[0]>cur[1]){if(cur)total+=cur[1]-cur[0];cur=[...s]}else cur[1]=Math.max(cur[1],s[1])}
  if(cur)total+=cur[1]-cur[0];return total;
}
function estimateEdu(t){
  t=t.toLowerCase();
  if(/\b(ph\.?d|doctorate|master'?s|mba|m\.s\.|m\.a\.|j\.d\.|m\.ed)\b/.test(t))return "3";
  if(/\b(bachelor'?s?|b\.s\.|b\.a\.|bs in|ba in|bsc)\b/.test(t))return "2";
  if(/\b(associate'?s?|certificate|bootcamp|diploma in)\b/.test(t))return "1";
  return "";
}
function ingest(text,source){
  const st=document.getElementById("fileStatus"), clean=(text||"").trim(), pr=state.profile;
  if(clean.length<80){st.className="status err";st.textContent=source==="file"?"Couldn't find readable text in that file (it may be a scanned image). Try pasting the text instead.":"That's pretty short. Paste the full resume text.";return}
  pr.resume=clean.slice(0,20000);pr._fromFile=source==="file";pr.auto=detectSkills(clean);
  const y=estimateYears(clean);
  if(pr.years===""&&y)pr.years=y<1?"0.5":y<3?"2":y<7?"5":y<15?"10":"18";
  const e=estimateEdu(clean);if(pr.edu===""&&e)pr.edu=e;
  save();renderCheckin();
  const st2=document.getElementById("fileStatus");st2.className="status ok";
  st2.textContent="Got it. Found "+pr.auto.length+" skills"+(y?", about "+Math.round(y)+" year"+(Math.round(y)===1?"":"s")+" of dated experience":"")+". Double-check the picks and basics below.";
}
function wireResume(){
  const drop=document.getElementById("drop"), file=document.getElementById("file");
  drop.addEventListener("click",()=>file.click());
  drop.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();file.click()}});
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
  drop.addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(f)handleFile(f)});
  file.addEventListener("change",()=>{if(file.files[0])handleFile(file.files[0]);file.value=""});
  document.getElementById("pasteBtn").addEventListener("click",()=>ingest(document.getElementById("paste").value,"paste"));
  document.getElementById("addSkillBtn").addEventListener("click",addSkill);
  document.getElementById("addSkill").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addSkill()}});
}
async function handleFile(f){
  const st=document.getElementById("fileStatus");st.className="status";st.textContent="Reading "+f.name+"…";
  try{ingest(await readFile(f),"file")}catch(err){st.className="status err";st.textContent=err.message||"Couldn't read that file. Try pasting the text."}
}

function meter(label,sub,x){return '<div class="meter'+(x==null?' na':'')+'"><div class="lab">'+esc(label)+(sub?'<small>'+esc(sub)+'</small>':'')+'</div><div class="tr"><i style="width:'+(x==null?0:pct(x))+'%"></i></div><div class="v">'+(x==null?'–':pct(x))+'</div></div>'}

/* Enough real answers to rank careers? Needs a spread of answers, not just a few. */
const READY_AT=20;
function readiness(P){
  const enough=P.answered>=READY_AT&&(P.riN>=6||P.nDims>=6);
  return {ready:enough,need:Math.max(0,READY_AT-P.answered)};
}
function analyze(){
  const P=compute();
  const scored=C.map(c=>scoreCareer(c,P)).sort((a,b)=>b.fit-a.fit);
  const code=P.riN>=6?Object.entries(P.R).filter(e=>e[1]!=null).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]).join(""):"";
  const B=P.B, L=(v,a,b)=>v==null?"?":v>=.5?a:b, mbti=P.b5N>=10?L(B.E,"E","I")+L(B.O,"N","S")+L(B.A,"F","T")+L(B.C,"J","P"):"";
  return {P,scored,code,mbti,ready:readiness(P)};
}

let lastScored=[];
/* Career lookup on the results page: every word must appear in the name or job titles. */
function searchCareers(q){
  const words=q.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>=2);
  if(!words.length)return [];
  const exact=x=>x.s.car.n.toLowerCase()===q.trim().toLowerCase()?1:0;
  return lastScored.map((s,i)=>({s,i,t:(s.car.n+' '+(s.car.titles||'')).toLowerCase()})).filter(x=>words.every(w=>x.t.includes(w)))

function stepping(scored,P){
  if(P.skills.size<2)return null;
  const fitOf=id=>{const s=scored.find(x=>x.car.id===id);return s?s.fit:0}, nameOf=id=>C.find(c=>c.id===id).n;
  return STEPS.map(st=>{
    const have=st.sk.filter(k=>P.skills.has(k)), need=st.sk.filter(k=>!P.skills.has(k));
    const ready=have.length/st.sk.length;
    const tg=st.to.map(id=>({id,n:nameOf(id),fit:fitOf(id)})).sort((a,b)=>b.fit-a.fit);
    const best=mean(tg.slice(0,2).map(t=>t.fit))/100;
    return {st,ready,tg,score:.5*ready+.5*best,have:have.map(k=>SK[k][0]),need:need.map(k=>SK[k][0])};
  }).sort((a,b)=>b.score-a.score);
}

    L.push("Love it, still building: "+(g.grow.map(x=>x.text).join("; ")||"none"));}
  L.push("Values order: "+(Array.isArray(A.rank_values)?A.rank_values.map(k=>VALUES.find(v=>v[0]===k)[1].split(" — ")[0]).join(" > "):"not ranked"));
  L.push("Pay: min "+(P.minSet?"$"+P.minPay+"k":"not set")+", 5-yr target "+(P.targetSet?"$"+P.target+"k":"not set"));
  L.push("Work-style dims (0-100, unanswered left out): "+Object.keys(DIMS).filter(k=>!P.skip.has(k)).map(k=>DIMS[k]+" "+pct(P.D[k])).join(", ")+", pay priority "+pct(P.D.pay)+", patience for a longer path "+pct(P.D.pat));
  L.push("Skills found on resume (confirmed): "+([...P.skills].map(s=>SK[s][0]).join(", ")||"none"));
  L.push("");
  L.push("TOP 15:");
  scored.slice(0,15).forEach((s,i)=>L.push((i+1)+". "+s.car.n+" — "+s.fit+"% ("+[["int",s.interest],["ability",s.ability],["resume",s.skillFit],["style",s.dimSim],["pay",s.payFit]].filter(x=>x[1]!=null).map(x=>x[0]+" "+pct(x[1])).join(", ")+")"+(s.flags.length?" | flags: "+s.flags.join("; "):"")));
  L.push("BOTTOM 5: "+scored.slice(-5).map(s=>s.car.n+" "+s.fit+"%").join(", "));
  const stp=stepping(scored,P);
  if(stp){L.push("");L.push("TOP STEPPING-STONE JOBS:");stp.slice(0,6).forEach((x,i)=>L.push((i+1)+". "+x.st.n+" — "+pct(x.ready)+"% ready → leads to "+x.tg.slice(0,3).map(t=>t.n+" ("+t.fit+"%)").join(", ")+(x.need.length?" | gaps: "+x.need.join(", "):"")))}
  L.push("");
  const notes=[];let qn=0;
  PAGES.forEach(pg=>pg.items.forEach(it=>{qn++;const nt=A[it.id+"_note"];if(it.t!=="open"&&nt&&nt.trim())notes.push("Q"+qn+" ["+pg.short+"] "+(it.text?T(itemText(it)):T(it.a)+" vs "+it.b)+"\n   Answer: "+ansText(it)+"\n   Note: "+nt.trim())}));
  L.push("NOTES ON ANSWERS:");
  L.push(notes.length?notes.join("\n"):"(none)");
  L.push("");
  const fd=fieldDirs();
  if(fieldItems().length){L.push("MY FIELD ("+FIELDS[curField()].label+"):");fieldItems().forEach(q=>L.push("- "+q.text+" → "+(A[q.id]!=null?q.opts[A[q.id]][0]:"(skipped)")));
    if(fd)L.push("Best-fit directions within my field: "+fd.slice(0,3).map(x=>x.name+" ("+pct(x.score)+")").join(", "));L.push("")}
  L.push("MY CAREER PATH:");
  PATHQ.forEach(q=>L.push("- "+q.text+" → "+(A[q.id]!=null?q.opts[A[q.id]][0]:"(skipped)")));
  L.push("");
  L.push("IN MY OWN WORDS:");
  OPEN.forEach(o=>L.push("Q: "+o.text+"\nA: "+(A[o.id]?String(A[o.id]).trim():"(skipped)")));
  L.push("");
  L.push("KEY ANSWERS:");
  SLIDERS.forEach(s=>L.push("- "+s.text+": "+(A[s.id]!=null?s.fmt(Number(A[s.id])):"(skipped)")));
  TF.forEach(t=>L.push("- "+t.text+" "+(A[t.id]==="t"?"TRUE":A[t.id]==="f"?"FALSE":"(skipped)")));
  AB.forEach(b=>L.push("- "+T(b.a)+" vs "+b.b+": "+(A[b.id]==="a"?T(b.a):A[b.id]==="b"?b.b:"(skipped)")));
  SJT.forEach(s=>L.push("- "+T(s.text)+" → "+(A[s.id]!=null?T(s.opts[A[s.id]][0]):"(skipped)")));
  L.push("");
  L.push("RAW INTERESTS enjoy/skill (1-5): "+RI.map(x=>x[0]+"="+(A[x[0]]??"-")+"/"+(A[x[0]+"_ab"]??"-")).join(" "));
  L.push("RAW BIG FIVE (1-5): "+B5.map(x=>x[0]+"="+(A[x[0]]??"-")).join(" "));
  if(pr.resume){L.push("");L.push("MY RESUME:");L.push(pr.resume.slice(0,8000))}
  return L.join("\n");
}

function copyText(text,okMsg){
  const done=()=>toast(okMsg);
  try{navigator.clipboard.writeText(text).then(done,()=>fallback())}catch(e){fallback()}
  function fallback(){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();
    if(ok)done();else{const pre=document.getElementById("sumtext");if(pre){const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast("Copy blocked — text is selected, press Ctrl+C")}}
}

function rerenderItem(it){const card=document.getElementById("q-"+it.id),num=card.querySelector(".qn").textContent;card.outerHTML=renderItem(it,num)}
app.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.go!==undefined){go(Number(b.dataset.go));return}
  if(b.dataset.skill){const pr=state.profile,id=b.dataset.skill;pr.off=pr.off.includes(id)?pr.off.filter(x=>x!==id):[...pr.off,id];save();renderSkillChips();return}
  if(b.dataset.id){
    const it=allItems().find(x=>x.id===b.dataset.id);
    let v=b.dataset.v; if(it.t==="lik"||it.t==="sjt"||it.t==="mc")v=Number(v);
    const key=b.dataset.key||it.id;
    state.answers[key]=state.answers[key]===v?null:v; save(); rerenderItem(it); return;
  }
  if(b.dataset.mv!==undefined){
    const it=allItems().find(x=>x.t==="rank");
    const order=(Array.isArray(state.answers[it.id])?state.answers[it.id]:(state.rankDraft||it.items.map(x=>x[0]))).slice();
    const i=Number(b.dataset.mv),j=i+Number(b.dataset.dir); if(j<0||j>=order.length)return;
    [order[i],order[j]]=[order[j],order[i]];
    state.answers[it.id]=order;
    save(); rerenderItem(it);
    const nb=document.querySelector('#q-'+it.id+' [data-mv="'+j+'"][data-dir="'+b.dataset.dir+'"]'); if(nb)nb.focus(); return;
  }
  if(b.dataset.rankok){const it=allItems().find(x=>x.t==="rank");state.answers[it.id]=(state.answers[it.id]||state.rankDraft||it.items.map(x=>x[0])).slice();save();rerenderItem(it);return}
  if(b.dataset.clear){state.answers[b.dataset.clear]=null;save();rerenderItem(allItems().find(x=>x.id===b.dataset.clear));return}
  const act=b.dataset.act;
  if(act==="copysum"){copyText(document.getElementById("sumtext").textContent,"Copied — paste it into Claude, ChatGPT, or any AI assistant");return}
  if(act==="print"){window.print();return}
  if(act==="copybackup"){copyText(JSON.stringify({v:2,answers:state.answers,profile:state.profile}),"Backup copied");return}
  if(act==="restore"){try{const o=JSON.parse(document.getElementById("in-backup").value);if(!o||!o.answers)throw 0;state.answers=o.answers;state.profile=Object.assign(blankProfile(),o.profile||{});save();toast("Answers restored");render()}catch(err){toast("That doesn't look like a backup. Paste the full text you copied.")}return}
  if(act==="reset"){document.getElementById("resetconfirm").hidden=false;return}
  if(act==="resetyes"){state={answers:{},page:-1,profile:blankProfile()};save();render();toast("Everything erased");return}
});

/* ============================================================
   LIVE MATCHES — top careers update as you answer
   ============================================================ */
const live={open:false,prev:null,moves:{},lastTop:null};
let liveTimer=null;
function scheduleLive(){clearTimeout(liveTimer);liveTimer=setTimeout(updateLive,120)}
function updateLive(){
  const el=document.getElementById("live"); if(!el)return;
  const p=state.page, onQuestions=p>=0&&p<PAGES.length;
  el.hidden=!onQuestions; document.body.classList.toggle("has-live",onQuestions); document.body.classList.toggle("live-open",onQuestions&&live.open);
  if(!onQuestions)return;
  const P=compute(), r=readiness(P);
  if(!r.ready){
    live.prev=null;
    el.innerHTML='<div class="live-in"><div class="live-row"><span class="live-lab">Live matches</span><div class="live-bar" aria-hidden="true"><i style="width:'+Math.round(100*Math.min(1,P.answered/READY_AT))+'%"></i></div><span class="small">'+(r.need?r.need+' more answer'+(r.need===1?'':'s')+' to unlock':'Answer a few Interests to unlock')+'</span></div></div>';
    return;
  }
  const scored=C.map(c=>scoreCareer(c,P)).sort((a,b)=>b.fit-a.fit), ranks={};
  scored.forEach((s,i)=>ranks[s.car.id]=i);
  // Arrows show how each top-5 career moved on your last answer that changed the order.
  const changed=!!live.prev&&scored.slice(0,5).some((s,i)=>live.prev[s.car.id]!==i);
  if(changed){live.moves={};scored.slice(0,5).forEach((s,i)=>{const was=live.prev[s.car.id];if(was!==i)live.moves[s.car.id]=was-i})}
  live.prev=ranks;
  const arrow=id=>{const d=live.moves[id];return d?'<span class="mv '+(d>0?'up':'dn')+'">'+(d>0?'▲':'▼')+Math.abs(d)+'</span>':''};
  const top=scored.slice(0,5);
  el.innerHTML='<div class="live-in"><div class="live-row"><span class="live-lab">Live matches</span><div class="live-top">'+
    top.slice(0,3).map((s,i)=>'<span class="lm'+(changed&&live.moves[s.car.id]?' flash':'')+'"><span class="nm">'+(i+1)+'. '+esc(s.car.n)+'</span><b>'+s.fit+'</b>'+arrow(s.car.id)+'</span>').join("")+
    '</div><button class="live-tog" data-livetog="1" aria-expanded="'+live.open+'">'+(live.open?'Hide':'Top 5')+'</button></div>'+
    (live.open?'<ol class="live-list">'+top.map((s,i)=>'<li><span class="n">'+(i+1)+'</span><span>'+esc(s.car.n)+'</span>'+arrow(s.car.id)+'<span class="f">'+s.fit+'%</span></li>').join("")+'</ol><p class="live-note">Based only on your '+P.answered+' answers so far. <a href="#" data-goresults="1">See full results →</a></p>':'')+
    '</div>';
}
document.getElementById("live").addEventListener("click",e=>{
  if(e.target.closest("[data-livetog]")){live.open=!live.open;updateLive();return}
  if(e.target.closest("[data-goresults]")){e.preventDefault();go(99)}
});
